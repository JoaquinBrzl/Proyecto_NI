<!DOCTYPE html>
<html lang="es" class="ni-zenit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-style-mode" content="1">
    <title>Restablecer contraseña || Grupo NI</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link href="assets/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=4.5.4">
    <link rel="stylesheet" href="assets/css/ni-header.css?v=5.1.4">
    <link rel="stylesheet" href="assets/css/ni-brand.css?v=1.0.1">
    <script src="assets/js/ni/header-boot.js?v=1.0.1"></script>
</head>
<body class="active-light-mode" data-ni-page="reset">
    <main class="page-wrapper">
        <header class="tmp-header ni-zenit-header header-default header-not-transparent header-sticky">
            <div class="container position-relative">
                <div class="row align-items-center row--0">
                    <div class="col-xl-2 col-lg-2 col-md-6 col-4">
                        <div class="logo">
                                <a class="ni-zenit-brand" href="index.html">
                                    <span class="ni-zenit-brand-mark" aria-hidden="true">
                                        <img src="assets/images/logo/ni-logo.png" alt="">
                                    </span>
                                    <span class="ni-zenit-brand-text">
                                        <strong>Zenit</strong>
                                        <span>por Grupo NI</span>
                                    </span>
                                </a>
                            </div>
                    </div>
                    <div class="col-xl-10 col-lg-10 col-md-6 col-8 position-static">
                        <div class="header-right with-search">
                                                        <div class="ni-zenit-actions" data-ni-zenit-actions="1">
                                <button type="button" class="ni-zenit-search-toggle" data-ni-search-open aria-expanded="false" aria-label="Buscar">
                                    <i class="feather-search" aria-hidden="true"></i>
                                    <span class="ni-zenit-search-label">Buscar</span>
                                </button>
                                <button type="button" class="ni-zenit-theme-toggle" data-ni-theme-toggle aria-pressed="false" aria-label="Cambiar tema" title="Modo oscuro">
                                    <i class="feather-moon" aria-hidden="true"></i>
                                </button>
                                <div class="ni-zenit-account" data-ni-zenit-account>
                                    <a class="ni-zenit-user" href="login.html" data-ni-login>
                                        <i class="feather-user" aria-hidden="true"></i>
                                        <span>Ingresar</span>
                                    </a>
                                </div>
                            </div>
                                <div class="header-btn" hidden>
                                <a class="tmp-btn" href="login.html">Ingresar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="inv-appoinment-area-start tmp-section-gap">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-6">
                            <div class="tmp-section-title-border text-center mb--30">
                                <h2 class="title w-700">Restablecer contraseña</h2>
                            </div>
                            <p id="ni-auth-msg" hidden class="text-center mb--20"></p>
                            <form id="ni-reset-request" class="contact-form-1 appoinment-form-wrapper tmponhover">
                                <div class="form-group tmponhover">
                                    <input type="email" name="email" placeholder="Email" required autocomplete="email">
                                </div>
                                <div class="form-group tmponhover">
                                    <button type="submit" class="btn-default btn-large tmp-btn" style="width:100%"><span>Enviar código</span></button>
                                </div>
                            </form>
                            <form id="ni-reset-code" class="contact-form-1 appoinment-form-wrapper tmponhover" hidden>
                                <div class="form-group tmponhover">
                                    <input type="text" name="code" placeholder="Código de 6 dígitos" required maxlength="6" inputmode="numeric">
                                </div>
                                <div class="form-group tmponhover">
                                    <button type="submit" class="btn-default btn-large tmp-btn" style="width:100%"><span>Validar código</span></button>
                                </div>
                            </form>
                            <form id="ni-reset-new" class="contact-form-1 appoinment-form-wrapper tmponhover" hidden>
                                <div class="form-group tmponhover">
                                    <input type="password" name="password" placeholder="Nueva contraseña" required minlength="6" autocomplete="new-password">
                                </div>
                                <div class="form-group tmponhover">
                                    <button type="submit" class="btn-default btn-large tmp-btn" style="width:100%"><span>Guardar contraseña</span></button>
                                </div>
                            </form>
                            <p class="text-center mt--20"><a href="login.html">Volver a ingresar</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/vendor/jquery.min.js" defer></script>
    <script src="assets/js/main.js" defer></script>
    <script type="module">
      import { initResetPage } from './assets/js/ni/auth-pages.js';
      initResetPage();
    </script>
</body>
</html>

[auth]
allowed_redirect_urls = [
  "http://localhost/landing/",
  "http://localhost/landing/index.html",
  "http://localhost/landing/login.html",
  "http://localhost/landing/perfil.html",
  "http://localhost/landing/register.html",
  "http://127.0.0.1/landing/",
  "http://127.0.0.1/landing/index.html",
  "http://127.0.0.1/landing/login.html",
  "http://127.0.0.1/landing/perfil.html",
  "http://127.0.0.1/landing/register.html"
]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7

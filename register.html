<!DOCTYPE html>
<html lang="es" class="ni-zenit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-style-mode" content="1">
    <title>Crear cuenta || Grupo NI</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link href="assets/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/ni-auth.css?v=1.0.3">
    <link rel="stylesheet" href="assets/css/ni-header.css?v=5.1.4">
    <link rel="stylesheet" href="assets/css/ni-brand.css?v=1.0.1">
    <script src="assets/js/ni/header-boot.js?v=1.0.1"></script>
</head>
<body class="ni-auth-page" data-ni-page="register">
    <div class="ni-auth-shell">
        <a class="ni-auth-brand" href="index.html">
            <img src="assets/images/logo/ni-logo.png" alt="">
            <span>Grupo NI</span>
        </a>

        <div class="ni-auth-card">
            <p id="ni-auth-msg" class="ni-auth-msg" hidden></p>

            <!-- Registro -->
            <div class="ni-auth-panel" id="ni-register-panel">
                <h1 class="ni-auth-card__title">Crear cuenta</h1>
                <p class="ni-auth-card__subtitle">Empiezas en NI Free automáticamente</p>

                <form id="ni-register-form" autocomplete="on">
                    <div class="ni-auth-field">
                        <input type="text" name="name" placeholder="Nombre completo" required autocomplete="name">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                    </div>
                    <div class="ni-auth-field">
                        <input type="email" name="email" placeholder="Email" required autocomplete="email">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                    </div>
                    <div class="ni-auth-field">
                        <input type="password" name="password" placeholder="Contraseña (mín. 6)" required autocomplete="new-password" minlength="6">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                    </div>
                    <div class="ni-auth-field">
                        <input type="password" name="password_confirm" placeholder="Confirmar contraseña" required autocomplete="new-password" minlength="6">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </span>
                    </div>

                    <button type="submit" class="ni-auth-submit">Registrarme</button>
                </form>

                <div class="ni-auth-divider">o regístrate con</div>

                <div class="ni-auth-oauth">
                    <button type="button" class="ni-auth-oauth-btn" data-ni-oauth="google">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Google
                    </button>
                    <button type="button" class="ni-auth-oauth-btn" data-ni-oauth="linkedin">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect fill="#fff" x="2" y="9" width="4" height="12"/><circle fill="#fff" cx="4" cy="4" r="2"/></svg>
                        LinkedIn
                    </button>
                </div>

                <p class="ni-auth-footer">
                    ¿Ya tienes cuenta? <a href="login.html">Ingresar</a>
                </p>
            </div>

            <!-- Verificar email -->
            <div class="ni-auth-panel" id="ni-verify-box" hidden>
                <h1 class="ni-auth-card__title">Verifica tu email</h1>
                <p class="ni-auth-card__subtitle">Te enviamos un código de 6 dígitos</p>

                <form id="ni-verify-form" autocomplete="on">
                    <div class="ni-auth-field">
                        <input type="email" id="ni-verify-email" name="email" placeholder="Email" required autocomplete="email">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                    </div>
                    <div class="ni-auth-field">
                        <input type="text" name="otp" placeholder="Código de 6 dígitos" required maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                        <span class="ni-auth-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </span>
                    </div>
                    <button type="submit" class="ni-auth-submit">Verificar</button>
                </form>

                <p class="ni-auth-footer">
                    <a href="#" id="ni-resend-verify">Reenviar código</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
      import { initRegisterPage } from './assets/js/ni/auth-pages.js?v=1.0.5';
      initRegisterPage();
    </script>
</body>
</html>
